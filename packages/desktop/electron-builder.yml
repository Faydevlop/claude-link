appId: com.claudelink.desktop
productName: Claude Link
copyright: Copyright © 2026 Fayis
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack:
  - out/main/mcp.js
  - out/main/chunks/**
extraResources:
  - from: build
    to: .
    filter: ["icon.png", "tray*.png"]
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.png
  identity: null
dmg:
  artifactName: Claude-Link-${version}-mac-${arch}.dmg
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  artifactName: Claude-Link-Setup-${version}.exe
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
npmRebuild: false
publish: null
